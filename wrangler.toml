name = "lunatv"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_v2"]
main = ".open-next/worker.js"
minify = true

# Node.js 兼容性
node_compat = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 环境变量
[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
